# ─── Production overrides ─────────────────────────────────────────────────
# Usage: helm upgrade --install cloudshadow ./helm/cloudshadow
#        -f helm/cloudshadow/values-prod.yaml
#        --set publicUrl=http://YOUR-EXTERNAL-IP
#        --set mysql.rootPassword=YOUR-SECURE-PASSWORD
#        --set backend.jwtSecret=YOUR-SECURE-SECRET

namespace: cloudshadow

# ── MySQL disabled (using RDS) ────────────────────────────────────────────
mysql:
  enabled: false          # ← RDS handles this
  storageClass: "gp2"       # AWS EBS storage class
  storage: "20Gi"
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

backend:
  replicas: 2               # High availability
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

aiService:
  replicas: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# ── Frontend disabled (using S3 + CloudFront) ─────────────────────────────
frontend:
  enabled: false          # ← CloudFront handles this
  replicas: 2