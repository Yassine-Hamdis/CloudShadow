# ─── Development overrides ────────────────────────────────────────────────
# Usage: helm upgrade --install cloudshadow ./helm/cloudshadow
#        -f helm/cloudshadow/values-dev.yaml

namespace: cloudshadow-dev

publicUrl: "http://localhost:8080"

# ── MySQL enabled (in-cluster for local dev) ──────────────────────────────
mysql:
  enabled: true           # ← run MySQL in cluster locally
  storageClass: "standard"  # minikube storage class
  storage: "5Gi"

backend:
  replicas: 1

aiService:
  replicas: 1

# ── Frontend enabled (in-cluster for local dev) ───────────────────────────
frontend:
  enabled: true           # ← run frontend in cluster locally
  replicas: 1