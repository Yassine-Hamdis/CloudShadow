name: AI Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service.yml'

  workflow_dispatch:

jobs:

  build-and-push:
    name: Build & Push AI Service Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Validate Python (catches import errors early) ────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./ai-service
        run: |
          pip install -r requirements.txt

      - name: Validate Python syntax
        working-directory: ./ai-service
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/analyzer.py
          python -m py_compile app/schemas.py
          python -m py_compile app/models/predictor.py
          python -m py_compile app/models/anomaly.py
          python -m py_compile app/engine/root_cause.py
          echo "✅ All Python files valid"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push AI service image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          dockerfile: ./ai-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudshadow-ai:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudshadow-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Check cluster connection
        id: cluster-check
        run: |
          if kubectl cluster-info --request-timeout=10s > /dev/null 2>&1; then
            echo "reachable=true" >> $GITHUB_OUTPUT
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy AI service to K8s
        if: steps.cluster-check.outputs.reachable == 'true'
        run: |
          kubectl rollout restart deployment/ai-service -n cloudshadow
          kubectl rollout status deployment/ai-service -n cloudshadow --timeout=120s
          echo "✅ AI Service deployed successfully"

      - name: Skip deploy (cluster offline)
        if: steps.cluster-check.outputs.reachable == 'false'
        run: |
          echo "⚠️ Deploy skipped - cluster is not running"
          echo "✅ Image is ready on Docker Hub"
          echo "   kubectl rollout restart deployment/ai-service -n cloudshadow"