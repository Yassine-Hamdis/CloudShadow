name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

  workflow_dispatch:

jobs:

  # ── Build and Push ───────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup Node for validation (optional) ────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── Install and build (catches errors early) ────────────────────────
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React app
        working-directory: ./frontend
        run: npm run build
        env:
          # Production build uses empty env (relative URLs)
          VITE_API_URL: ''
          VITE_WS_URL: ''

      # ── Login to Docker Hub ─────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build and Push ──────────────────────────────────────────────────
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudshadow-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudshadow-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Check cluster connection
        id: cluster-check
        run: |
          if kubectl cluster-info --request-timeout=10s > /dev/null 2>&1; then
            echo "reachable=true" >> $GITHUB_OUTPUT
            echo "✅ Cluster is reachable"
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
            echo "⚠️ Cluster is not reachable - skipping deploy"
          fi

      - name: Deploy frontend to K8s
        if: steps.cluster-check.outputs.reachable == 'true'
        run: |
          kubectl rollout restart deployment/frontend -n cloudshadow
          kubectl rollout status deployment/frontend -n cloudshadow --timeout=120s
          echo "✅ Frontend deployed successfully"

      - name: Skip deploy (cluster offline)
        if: steps.cluster-check.outputs.reachable == 'false'
        run: |
          echo "⚠️ Deploy skipped - cluster is not running"
          echo "✅ Image is ready on Docker Hub"
          echo "   Run manually when cluster is up:"
          echo "   kubectl rollout restart deployment/frontend -n cloudshadow"