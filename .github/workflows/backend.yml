name: Backend CI/CD

# ── Triggers ──────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths:
      # Only run when backend code changes
      - 'backend/**'
      - '.github/workflows/backend.yml'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# ── Jobs ──────────────────────────────────────────────────────────────────
jobs:

  # ── Job 1: Build and Push to Docker Hub ─────────────────────────────────
  build-and-push:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest

    steps:
      # ── Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup Java 17 ──────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── Build Spring Boot JAR ───────────────────────────────────────────
      - name: Build with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

      # ── Login to Docker Hub ─────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Setup Docker Buildx (for better caching) ────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build and Push ──────────────────────────────────────────────────
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudshadow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudshadow-backend:${{ github.sha }}
          # Cache layers between builds (faster builds)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Deploy to K8s ────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push   # Only runs if build succeeded

    steps:
      # ── Setup kubectl ───────────────────────────────────────────────────
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      # ── Configure K8s access ────────────────────────────────────────────
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # ── Check if cluster is reachable ───────────────────────────────────
      - name: Check cluster connection
        id: cluster-check
        run: |
          if kubectl cluster-info --request-timeout=10s > /dev/null 2>&1; then
            echo "reachable=true" >> $GITHUB_OUTPUT
            echo "✅ Cluster is reachable"
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
            echo "⚠️ Cluster is not reachable - skipping deploy"
          fi

      # ── Deploy (only if cluster is reachable) ───────────────────────────
      - name: Deploy backend to K8s
        if: steps.cluster-check.outputs.reachable == 'true'
        run: |
          kubectl rollout restart deployment/backend -n cloudshadow
          kubectl rollout status deployment/backend -n cloudshadow --timeout=120s
          echo "✅ Backend deployed successfully"

      # ── Skip message ─────────────────────────────────────────────────────
      - name: Skip deploy (cluster offline)
        if: steps.cluster-check.outputs.reachable == 'false'
        run: |
          echo "⚠️ Deploy skipped - cluster is not running"
          echo "✅ Image is ready on Docker Hub"
          echo "   Run manually when cluster is up:"
          echo "   kubectl rollout restart deployment/backend -n cloudshadow"